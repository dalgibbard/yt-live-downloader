version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      include: "scope"
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directories:
      - "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "fix"
      include: "scope"
    labels:
      - "dependencies"
