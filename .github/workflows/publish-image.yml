name: Test, release, and publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Sanity check container requirements variant
        run: |
          python -m venv .docker-venv
          .docker-venv/bin/pip install --quiet -r requirements-docker.txt
          .docker-venv/bin/python -c "import yt_dlp, sys; print('yt-dlp', yt_dlp.version.__version__, 'on', sys.version.split()[0])"

  release:
    name: Update release
    needs: test
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Create or update release
        id: release
        uses: googleapis/release-please-action@v5

  publish:
    name: Build and publish
    needs:
      - test
      - release
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value={{date 'YYYYMMDD' tz='UTC'}}-{{sha}}
            type=raw,value=latest
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.release_created == 'true' }}
            type=raw,value=v${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.release_created == 'true' }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report-only CVE scan of the image we just published. Informational: it
      # never fails the build, it just records the OS/Python vulnerability
      # surface of each published image in the job log.
      - name: Scan published image for CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ vars.DOCKERHUB_IMAGE }}:latest
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          scanners: vuln
        continue-on-error: true

      - name: Scan published Python dependencies for CVEs
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/pip install --quiet pip-audit
          .audit-venv/bin/pip-audit -r requirements-docker.txt -r requirements-dev.txt --progress-spinner off
        continue-on-error: true
