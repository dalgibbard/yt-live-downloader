services:
  yt-live-downloader:
    build: .
    image: yt-live-downloader:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    environment:
      DOWNLOAD_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-6}
      YTDLP_CONCURRENT_FRAGMENTS: ${YTDLP_CONCURRENT_FRAGMENTS:-4}
    volumes:
      - type: bind
        source: ./downloads
        target: /data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=2).read()
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
